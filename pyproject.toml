[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primecli"
version = "0.5.2"
description = "Agent-friendly CLI tools for the DeltaPrime (Avalanche + Arbitrum) and DegenPrime (Base) lending and leverage protocols. Preview-by-default; no Etherscan key required."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mnemosyne-quest contributors"}]
keywords = ["defi", "deltaprime", "degenprime", "arbprime", "avalanche", "base", "arbitrum", "lending", "leverage", "ethereum", "web3", "agent", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "web3>=7.0,<8",
    "eth-account>=0.13",
    "eth-keys>=0.5",
    "eth-abi>=5.0,<7",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/Mnemosyne-quest/primecli"
Issues = "https://github.com/Mnemosyne-quest/primecli/issues"
Documentation = "https://github.com/Mnemosyne-quest/primecli/tree/main/docs"

[project.scripts]
deltaprime = "primecli.deltaprime:main"
degenprime = "primecli.degenprime:main"
arbprime = "primecli.arbprime:main"

[tool.setuptools.packages.find]
include = ["primecli*"]
