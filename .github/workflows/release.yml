name: Release

# Triggered when a version tag is pushed (vX.Y.Z). Builds the wheel + sdist,
# publishes to PyPI via Trusted Publishing (OIDC, no API tokens), and creates
# the matching GitHub Release with the built artifacts attached.
#
# To cut a release:
#   1. Bump `version` in pyproject.toml.
#   2. Commit the bump.
#   3. `git tag vX.Y.Z && git push --tags`
# That's it. This workflow does the rest.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build wheel and sdist
        run: python -m build
      - name: Store the distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match what's configured on the PyPI pending-publisher
    # form for the trust relationship to be accepted.
    environment:
      name: pypi
      url: https://pypi.org/p/primecli
    permissions:
      # Required for OIDC token exchange with PyPI; no PyPI API token is used.
      id-token: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history for auto-generated release notes
      - name: Download the distribution
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
